      required: [endpoint]
      properties:
        endpoint:
          type: string
          description: External endpoint name or id
    steps:
      - stepId: find
        operationId: list-dbaas-external-endpoints
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['dbaas-endpoints'][?@.name == '{$inputs.endpoint}' || @.id == '{$inputs.endpoint}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.endpoint}' || @.id == '{$inputs.endpoint}']) == 1]"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$['dbaas-endpoints'][?@.name == '{$inputs.endpoint}' || @.id == '{$inputs.endpoint}'].id"
          type:
            context: $response.body
            type: jsonpath
            selector: "$['dbaas-endpoints'][?@.name == '{$inputs.endpoint}' || @.id == '{$inputs.endpoint}'].type"
