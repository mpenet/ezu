# Exoscale's `exo compute` commands as Arazzo workflows: resources are named
# by name or id, changes wait for their job to finish and show the result.
#
# Name the document in ezu's configuration, with a profile for Exoscale:
#
#   "arazzo": {"exo-compute": {"file": ".../exoscale-compute.arazzo.yaml",
#                              "profile": "exo"}}
#
# then make it a command (`ezu az exo-compute --link` prints how):
#
#   exo-compute instance-list
#   exo-compute instance-create web1 template="Linux Ubuntu 24.04 LTS 64-bit" \
#     size=medium ssh-key=me labels.env=prod
#   exo-compute instance-stop web1
#   exo-compute security-group-rule-add web port=443
#   exo-compute instance-list --server.zone=de-fra-1
#
# Where exo takes a resource as NAME|ID, so do these workflows; the zone is
# the API's server variable (--server.zone, or "server" in the profile).
arazzo: 1.1.0
info:
  title: Exoscale compute
  summary: The exo compute commands, as workflows over the Exoscale API.
  version: 1.0.0
sourceDescriptions:
  - name: exoscale
    url: https://openapi-v2.exoscale.com/source.json
    type: openapi
workflows:
  # ---- operations ----

  - workflowId: operation-wait
    summary: Wait until an operation (a job) succeeds, and return what it acted on.
    x-ezu-args: [id]
    inputs:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Operation id
    steps:
      - stepId: poll
        operationId: get-operation
        parameters:
          - name: id
            in: path
            value: $inputs.id
        successCriteria:
          - condition: $response.body#/state == 'success'
        onFailure:
          # still running: ask again in 2 seconds; a failed or timed out
          # operation ends the workflow with an error
          - name: pending
            type: goto
            stepId: poll
            retryAfter: 2
            criteria:
              - condition: $response.body#/state == 'pending'
        outputs:
          reference: $response.body#/reference/id
    outputs:
      reference: $steps.poll.outputs.reference

  # ---- instances ----

  - workflowId: instance-id
    summary: The id of an instance, given its name or id.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
    steps:
      - stepId: find
        operationId: list-instances
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$.instances[?@.name == '{$inputs.instance}' || @.id == '{$inputs.instance}']"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$.instances[?@.name == '{$inputs.instance}' || @.id == '{$inputs.instance}'].id"
    outputs:
      id: $steps.find.outputs.id

  - workflowId: instance-list
    summary: List the instances of the zone.
    steps:
      - stepId: list
        operationId: list-instances
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          instances: $response.body#/instances
    outputs:
      instances: $steps.list.outputs.instances

  - workflowId: instance-show
    summary: Show an instance.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: show
        operationId: get-instance
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          instance: $response.body
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-create
    summary: Create an instance, wait until it exists, and show it.
    x-ezu-args: [name]
    inputs:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Instance name
        template:
          type: string
          description: Template name or id
          default: Linux Ubuntu 24.04 LTS 64-bit
        template-visibility:
          type: string
          enum: [public, private]
          description: Where to look for the template
          default: public
        family:
          type: string
          description: Instance type family (standard, cpu, memory…)
          default: standard
        size:
          type: string
          description: Instance type size (micro, small, medium, large…)
          default: medium
        disk-size:
          type: integer
          description: Disk size in GiB
          default: 50
        ssh-key:
          type: string
          description: Name of an SSH key to deploy on the instance
        private-network:
          type: string
          description: Name or id of a private network to attach the instance to
        public-ip:
          type: string
          enum: [inet4, dual, none]
          description: Public IP addresses to assign
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels, as labels.KEY=VALUE
        user-data:
          type: string
          description: Cloud-init user data, base64-encoded
    steps:
      - stepId: template
        operationId: list-templates
        parameters:
          - name: visibility
            in: query
            value: $inputs.template-visibility
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}'].id"
      - stepId: instance-type
        operationId: list-instance-types
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['instance-types'][?@.family == '{$inputs.family}' && @.size == '{$inputs.size}']"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$['instance-types'][?@.family == '{$inputs.family}' && @.size == '{$inputs.size}'].id"
      - stepId: create
        operationId: create-instance
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.name
            template:
              id: $steps.template.outputs.id
            instance-type:
              id: $steps.instance-type.outputs.id
            disk-size: $inputs.disk-size
            ssh-key:
              name: $inputs.ssh-key
            public-ip-assignment: $inputs.public-ip
            labels: $inputs.labels
            user-data: $inputs.user-data
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: created
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.create.outputs.job
        onSuccess:
          - name: no-private-network
            type: goto
            stepId: show
            criteria:
              - condition: $inputs.private-network == null
      - stepId: network
        workflowId: private-network-id
        parameters:
          - name: private-network
            value: $inputs.private-network
      - stepId: attach
        operationId: attach-instance-to-private-network
        parameters:
          - name: id
            in: path
            value: $steps.network.outputs.id
        requestBody:
          contentType: application/json
          payload:
            instance:
              id: $steps.created.outputs.reference
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: attached
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.attach.outputs.job
      - stepId: show
        operationId: get-instance
        parameters:
          - name: id
            in: path
            value: $steps.created.outputs.reference
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          instance: $response.body
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-update
    summary: Rename an instance or change its labels or public IP assignment.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
        name:
          type: string
          description: New name
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels, as labels.KEY=VALUE; they replace the current ones
        public-ip:
          type: string
          enum: [inet4, dual, none]
          description: Public IP addresses to assign
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: update
        operationId: update-instance
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.name
            labels: $inputs.labels
            public-ip-assignment: $inputs.public-ip
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.update.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-delete
    summary: Delete an instance and wait until it is gone.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: delete
        operationId: delete-instance
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.delete.outputs.job
    outputs:
      deleted: $steps.find.outputs.id

  - workflowId: instance-start
    summary: Start an instance.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
        rescue-profile:
          type: string
          enum: [netboot, netboot-efi]
          description: Boot into a rescue profile
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: start
        operationId: start-instance
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            rescue-profile: $inputs.rescue-profile
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.start.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-stop
    summary: Stop an instance.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: stop
        operationId: stop-instance
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.stop.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-reboot
    summary: Reboot an instance.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: reboot
        operationId: reboot-instance
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.reboot.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-reset
    summary: Reinstall an instance from a template, erasing its disk.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
        template:
          type: string
          description: Template name or id; the instance's own by default
        template-visibility:
          type: string
          enum: [public, private]
          description: Where to look for the template
          default: public
        disk-size:
          type: integer
          description: New disk size in GiB; the current one by default
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
        onSuccess:
          - name: same-template
            type: goto
            stepId: reset
            criteria:
              - condition: $inputs.template == null
      - stepId: template
        operationId: list-templates
        parameters:
          - name: visibility
            in: query
            value: $inputs.template-visibility
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}'].id"
      - stepId: reset
        operationId: reset-instance
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            template:
              id: $steps.template.outputs.id
            disk-size: $inputs.disk-size
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.reset.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-scale
    summary: Change an instance's type; the instance must be stopped.
    x-ezu-args: [instance, size]
    inputs:
      type: object
      required: [instance, size]
      properties:
        instance:
          type: string
          description: Instance name or id
        family:
          type: string
          description: Instance type family (standard, cpu, memory…)
          default: standard
        size:
          type: string
          description: Instance type size (micro, small, medium, large…)
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: instance-type
        operationId: list-instance-types
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['instance-types'][?@.family == '{$inputs.family}' && @.size == '{$inputs.size}']"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$['instance-types'][?@.family == '{$inputs.family}' && @.size == '{$inputs.size}'].id"
      - stepId: scale
        operationId: scale-instance
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            instance-type:
              id: $steps.instance-type.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.scale.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-resize-disk
    summary: Grow an instance's disk; the instance must be stopped.
    x-ezu-args: [instance, disk-size]
    inputs:
      type: object
      required: [instance, disk-size]
      properties:
        instance:
          type: string
          description: Instance name or id
        disk-size:
          type: integer
          description: New disk size in GiB
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: resize
        operationId: resize-instance-disk
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            disk-size: $inputs.disk-size
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.resize.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-reveal-password
    summary: Show the password of an instance created from a template that sets one.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: reveal
        operationId: reveal-instance-password
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          password: $response.body#/password
    outputs:
      password: $steps.reveal.outputs.password

  - workflowId: instance-security-group-add
    summary: Add an instance to a security group.
    x-ezu-args: [instance, security-group]
    inputs:
      type: object
      required: [instance, security-group]
      properties:
        instance:
          type: string
          description: Instance name or id
        security-group:
          type: string
          description: Security group name or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: group
        workflowId: security-group-id
        parameters:
          - name: security-group
            value: $inputs.security-group
      - stepId: attach
        operationId: attach-instance-to-security-group
        parameters:
          - name: id
            in: path
            value: $steps.group.outputs.id
        requestBody:
          contentType: application/json
          payload:
            instance:
              id: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.attach.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-security-group-remove
    summary: Remove an instance from a security group.
    x-ezu-args: [instance, security-group]
    inputs:
      type: object
      required: [instance, security-group]
      properties:
        instance:
          type: string
          description: Instance name or id
        security-group:
          type: string
          description: Security group name or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: group
        workflowId: security-group-id
        parameters:
          - name: security-group
            value: $inputs.security-group
      - stepId: detach
        operationId: detach-instance-from-security-group
        parameters:
          - name: id
            in: path
            value: $steps.group.outputs.id
        requestBody:
          contentType: application/json
          payload:
            instance:
              id: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.detach.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-private-network-attach
    summary: Attach an instance to a private network.
    x-ezu-args: [instance, private-network]
    inputs:
      type: object
      required: [instance, private-network]
      properties:
        instance:
          type: string
          description: Instance name or id
        private-network:
          type: string
          description: Private network name or id
        ip:
          type: string
          description: Address to give the instance, on a managed network
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: network
        workflowId: private-network-id
        parameters:
          - name: private-network
            value: $inputs.private-network
      - stepId: attach
        operationId: attach-instance-to-private-network
        parameters:
          - name: id
            in: path
            value: $steps.network.outputs.id
        requestBody:
          contentType: application/json
          payload:
            instance:
              id: $steps.find.outputs.id
            ip: $inputs.ip
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.attach.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-private-network-detach
    summary: Detach an instance from a private network.
    x-ezu-args: [instance, private-network]
    inputs:
      type: object
      required: [instance, private-network]
      properties:
        instance:
          type: string
          description: Instance name or id
        private-network:
          type: string
          description: Private network name or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: network
        workflowId: private-network-id
        parameters:
          - name: private-network
            value: $inputs.private-network
      - stepId: detach
        operationId: detach-instance-from-private-network
        parameters:
          - name: id
            in: path
            value: $steps.network.outputs.id
        requestBody:
          contentType: application/json
          payload:
            instance:
              id: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.detach.outputs.job
      - stepId: show
        workflowId: instance-show
        parameters:
          - name: instance
            value: $steps.find.outputs.id
    outputs:
      instance: $steps.show.outputs.instance

  - workflowId: instance-elastic-ip-attach
    summary: Attach an elastic IP to an instance.
    x-ezu-args: [instance, elastic-ip]
    inputs:
      type: object
      required: [instance, elastic-ip]
      properties:
        instance:
          type: string
          description: Instance name or id
        elastic-ip:
          type: string
          description: Elastic IP address or id
    steps:
      - stepId: find
        workflowId: instance-id
        parameters:
          - name: instance
            value: $inputs.instance
      - stepId: address
