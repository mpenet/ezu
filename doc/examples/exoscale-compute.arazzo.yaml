    inputs:
      type: object
      required: [volume]
      properties:
        volume:
          type: string
          description: Volume name or id
        name:
          type: string
          description: New name
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels, as labels.KEY=VALUE; they replace the current ones
        size:
          type: integer
          description: New size in GiB, larger than the current one
    steps:
      - stepId: find
        workflowId: $sourceDescriptions.common.block-storage-id
        parameters:
          - name: volume
            value: $inputs.volume
        onSuccess:
          - name: resize-only
            type: goto
            stepId: resize
            criteria:
              - condition: $inputs.name == null && $inputs.labels == null && $inputs.size != null
      - stepId: update
        operationId: update-block-storage-volume
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
