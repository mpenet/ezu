          type: string
          description: Security group name or id
    steps:
      - stepId: find
        operationId: list-security-groups
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['security-groups'][?@.name == '{$inputs.security-group}' || @.id == '{$inputs.security-group}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.security-group}' || @.id == '{$inputs.security-group}']) == 1]"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$['security-groups'][?@.name == '{$inputs.security-group}' || @.id == '{$inputs.security-group}'].id"
    outputs:
      id: $steps.find.outputs.id

