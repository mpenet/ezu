# Exoscale's `exo dbaas` commands as Arazzo workflows, mounted by
# exoscale.arazzo.yaml as `exo dbaas`. Services are named by name. Where the
# API has an operation per engine, the engine is a command word (`create pg
# NAME PLAN`, `user show kafka SERVICE USER`); engine settings are object
# inputs (pg-settings.KEY=VALUE, or JSON with --inputs). Changes wait for
# their operation to finish and show the result.
arazzo: 1.1.0
info:
  title: Exoscale DBaaS
  summary: Database services (PostgreSQL, MySQL, Kafka, OpenSearch, Valkey…), users, databases, integrations…
  version: 1.0.0
sourceDescriptions:
  - name: exoscale
    url: https://openapi-v2.exoscale.com/source.json
    type: openapi
  # waiting for operations
  - name: common
    url: exoscale-common.arazzo.yaml
    type: arazzo
workflows:
  # ---- database services ----

  - workflowId: list
    x-ezu-command: list
    summary: List the database services of the zone.
    steps:
      - stepId: list
        operationId: list-dbaas-services
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          services: $response.body#/dbaas-services
    outputs:
      services: $steps.list.outputs.services

  - workflowId: show-pg
    x-ezu-command: show pg
    summary: Show a PostgreSQL service.
    x-ezu-args: [service]
    inputs:
      type: object
      required: [service]
      properties:
        service:
          x-ezu-complete: {workflowId: list, selector: "$.services[*].name"}
          type: string
          description: Database service name
    steps:
      - stepId: show
        operationId: get-dbaas-service-pg
        parameters:
          - name: name
            in: path
            value: $inputs.service
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          service: $response.body
    outputs:
      service: $steps.show.outputs.service

  - workflowId: show-mysql
    x-ezu-command: show mysql
    summary: Show a MySQL service.
    x-ezu-args: [service]
