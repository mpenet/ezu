  - workflowId: create-pg
    x-ezu-command: create pg
    summary: Create a PostgreSQL service, wait until it is accepted, and show it.
    x-ezu-args: [name, plan]
    inputs:
      type: object
      required: [name, plan]
      properties:
        name:
          type: string
          description: Database service name
        plan:
          type: string
          description: Plan (hobbyist-2, startup-4, business-8…)
        termination-protection:
          type: boolean
          description: Protect the service against deletion
          default: true
        version:
          type: string
          enum: ["13", "14", "15", "16", "17", "18"]
          description: Major version
        maintenance-dow:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday, never]
          description: Day of the week of automatic maintenance; with maintenance-time
        maintenance-time:
          type: string
          description: Time of automatic maintenance, HH:MM:SS UTC; with maintenance-dow
        ip-filter:
          type: array
          items:
            type: string
          description: CIDR blocks allowed to connect; repeat for several
        fork-from:
          type: string
          description: Name of a service to fork from
        recovery-backup-time:
          type: string
          description: Time of the backup to restore when forking (ISO 8601)
        admin-username:
          type: string
          description: Name of the admin user
        admin-password:
          type: string
          description: Password of the admin user; random by default
        backup-hour:
          type: integer
          description: Hour (UTC) of the daily backup
        backup-minute:
          type: integer
          description: Minute of the daily backup
        variant:
          type: string
          enum: [aiven, timescale]
          description: PostgreSQL variant
        synchronous-replication:
          type: string
          enum: [quorum, "off"]
          description: Synchronous replication
        shared-buffers-percentage:
          type: integer
          description: Share of RAM for shared buffers, 20 to 60
        work-mem:
          type: integer
          description: Memory for query operations before using temporary files, in MB
        migration:
          type: object
          description: Migrate data from an existing server, as migration.host=… migration.port=…
          required: [host, port]
          properties:
            host:
              type: string
              description: Hostname or IP address of the server
            port:
              type: integer
              description: Port of the server
            username:
              type: string
              description: User name on the server
            password:
              type: string
              description: Password on the server
            dbname:
              type: string
              description: Database for the initial connection
            ssl:
              type: boolean
              description: Connect with SSL
            method:
              type: string
              enum: [dump, replication]
              description: Migration method
            ignore-dbs:
              type: string
              description: Comma-separated databases not to migrate
        pg-settings:
          type: object
          description: PostgreSQL settings, as pg-settings.KEY=VALUE or with --inputs; `type settings pg` lists them
        pgaudit-settings:
          type: object
          description: pgaudit settings, as pgaudit-settings.KEY=VALUE or with --inputs; `type settings pg` lists them
        pgbouncer-settings:
          type: object
          description: PgBouncer settings, as pgbouncer-settings.KEY=VALUE or with --inputs; `type settings pg` lists them
        pglookout-settings:
          type: object
          description: pglookout settings, as pglookout-settings.KEY=VALUE or with --inputs; `type settings pg` lists them
        timescaledb-settings:
          type: object
          description: TimescaleDB settings, as timescaledb-settings.KEY=VALUE or with --inputs; `type settings pg` lists them
    steps:
      - stepId: create
        operationId: create-dbaas-service-pg
        parameters:
          - name: name
            in: path
            value: $inputs.name
        requestBody:
          contentType: application/json
          payload:
            plan: $inputs.plan
            termination-protection: $inputs.termination-protection
            version: $inputs.version
            maintenance:
              dow: $inputs.maintenance-dow
              time: $inputs.maintenance-time
            ip-filter: $inputs.ip-filter
            fork-from-service: $inputs.fork-from
            recovery-backup-time: $inputs.recovery-backup-time
            admin-username: $inputs.admin-username
            admin-password: $inputs.admin-password
            backup-schedule:
              backup-hour: $inputs.backup-hour
              backup-minute: $inputs.backup-minute
            variant: $inputs.variant
            synchronous-replication: $inputs.synchronous-replication
            shared-buffers-percentage: $inputs.shared-buffers-percentage
            work-mem: $inputs.work-mem
            migration: $inputs.migration
            pg-settings: $inputs.pg-settings
            pgaudit-settings: $inputs.pgaudit-settings
            pgbouncer-settings: $inputs.pgbouncer-settings
            pglookout-settings: $inputs.pglookout-settings
            timescaledb-settings: $inputs.timescaledb-settings
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.create.outputs.job
      - stepId: show
        workflowId: show-pg
        parameters:
          - name: service
            value: $inputs.name
    outputs:
      service: $steps.show.outputs.service

