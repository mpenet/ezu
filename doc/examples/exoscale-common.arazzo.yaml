# Steps the Exoscale workflows share: waiting for an operation (a job) to
# finish, and finding a resource's id given its name or id.
arazzo: 1.1.0
info:
  title: Exoscale common steps
  version: 1.0.0
sourceDescriptions:
  - name: exoscale
    url: https://openapi-v2.exoscale.com/source.json
    type: openapi
workflows:
  - workflowId: operation-wait
    summary: Wait until an operation (a job) succeeds, and return what it acted on.
    x-ezu-args: [id]
    inputs:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Operation id
    steps:
      - stepId: poll
        operationId: get-operation
        parameters:
          - name: id
            in: path
            value: $inputs.id
        successCriteria:
          - condition: $response.body#/state == 'success'
        onFailure:
          # still running: ask again in 2 seconds; a failed or timed out
          # operation ends the workflow with an error
          - name: pending
            type: goto
            stepId: poll
            retryAfter: 2
            criteria:
              - condition: $response.body#/state == 'pending'
        outputs:
          reference: $response.body#/reference/id
    outputs:
      reference: $steps.poll.outputs.reference

  - workflowId: instance-id
    summary: The id of an instance, given its name or id.
    x-ezu-args: [instance]
    inputs:
      type: object
      required: [instance]
      properties:
        instance:
          type: string
          description: Instance name or id
    steps:
      - stepId: find
        operationId: list-instances
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$.instances[?@.name == '{$inputs.instance}' || @.id == '{$inputs.instance}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.instance}' || @.id == '{$inputs.instance}']) == 1]"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$.instances[?@.name == '{$inputs.instance}' || @.id == '{$inputs.instance}'].id"
    outputs:
      id: $steps.find.outputs.id

  - workflowId: security-group-id
    summary: The id of a security group, given its name or id.
    x-ezu-args: [security-group]
    inputs:
      type: object
      required: [security-group]
