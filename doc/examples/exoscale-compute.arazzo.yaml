  # The pool is created empty, so that its security group, anti-affinity
  # group and private network (each optional) are set before it is scaled
  # to its size and its instances are created.
  - workflowId: instance-pool-create
    x-ezu-command: instance-pool create
    summary: Create an instance pool, wait until its instances exist, and show it.
    x-ezu-args: [name]
    inputs:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Instance pool name
        size:
          type: integer
          description: Number of instances
          default: 1
        description:
          type: string
          description: Description
        template:
          type: string
          description: Template name or id
          default: Linux Ubuntu 24.04 LTS 64-bit
        template-visibility:
          type: string
          enum: [public, private]
          description: Where to look for the template
          default: public
        family:
          type: string
          description: Instance type family (standard, cpu, memory…)
          default: standard
        instance-size:
          type: string
          description: Instance type size (micro, small, medium, large…)
          default: medium
        disk-size:
          type: integer
          description: Disk size in GiB
          default: 50
        ssh-key:
          type: string
          description: Name of an SSH key to deploy on the instances
        instance-prefix:
          type: string
          description: Prefix of the instances' names
        public-ip:
          type: string
          enum: [inet4, dual, none]
          description: Public IP addresses to assign
        ipv6:
          type: boolean
          description: Give the instances IPv6 addresses
        min-available:
          type: integer
          description: Minimum number of running instances
        security-group:
          type: string
          description: Name or id of a security group for the instances
        anti-affinity-group:
          type: string
          description: Name or id of an anti-affinity group for the instances
        private-network:
          type: string
          description: Name or id of a private network to attach the instances to
        deploy-target:
          type: string
          description: Name or id of a deploy target for the instances
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels, as labels.KEY=VALUE
        user-data:
          type: string
          description: Cloud-init user data, base64-encoded
    steps:
      - stepId: template
        operationId: list-templates
        parameters:
          - name: visibility
            in: query
            value: $inputs.template-visibility
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']) == 1]"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}'].id"
      - stepId: instance-type
        operationId: list-instance-types
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['instance-types'][?@.family == '{$inputs.family}' && @.size == '{$inputs.instance-size}']"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$['instance-types'][?@.family == '{$inputs.family}' && @.size == '{$inputs.instance-size}'].id"
        onSuccess:
          - name: skip-to-create
            type: goto
            stepId: create
            criteria:
              - condition: $inputs.deploy-target == null && $inputs.security-group == null && $inputs.anti-affinity-group == null && $inputs.private-network == null
          - name: skip-to-private-network
            type: goto
            stepId: private-network
            criteria:
              - condition: $inputs.deploy-target == null && $inputs.security-group == null && $inputs.anti-affinity-group == null
          - name: skip-to-anti-affinity-group
            type: goto
            stepId: anti-affinity-group
            criteria:
              - condition: $inputs.deploy-target == null && $inputs.security-group == null
          - name: skip-to-security-group
            type: goto
            stepId: security-group
            criteria:
              - condition: $inputs.deploy-target == null
      - stepId: deploy-target
        workflowId: deploy-target-id
        parameters:
          - name: deploy-target
            value: $inputs.deploy-target
        onSuccess:
          - name: skip-to-create
            type: goto
            stepId: create
            criteria:
              - condition: $inputs.security-group == null && $inputs.anti-affinity-group == null && $inputs.private-network == null
          - name: skip-to-private-network
            type: goto
            stepId: private-network
            criteria:
              - condition: $inputs.security-group == null && $inputs.anti-affinity-group == null
          - name: skip-to-anti-affinity-group
            type: goto
            stepId: anti-affinity-group
            criteria:
