        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.scale.outputs.job
      - stepId: show
        workflowId: nodepool-show
        parameters:
          - name: cluster
            value: $steps.find.outputs.cluster
          - name: nodepool
            value: $steps.find.outputs.id
    outputs:
