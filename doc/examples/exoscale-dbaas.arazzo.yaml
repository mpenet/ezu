  - workflowId: delete
    x-ezu-command: delete
    x-ezu-confirm: "Delete database service {$inputs.service}?"
    summary: Delete a database service and wait until it is gone.
    x-ezu-args: [service]
    inputs:
      type: object
      required: [service]
      properties:
        service:
          x-ezu-complete: {workflowId: list, selector: "$.services[*].name"}
          type: string
          description: Database service name
    steps:
      - stepId: find
        operationId: list-dbaas-services
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['dbaas-services'][?@.name == '{$inputs.service}']"
        onSuccess:
          - name: clickhouse
            type: goto
            stepId: delete-clickhouse
            criteria:
              - condition: $steps.find.outputs.type#/0 == 'clickhouse'
        outputs:
          type:
            context: $response.body
            type: jsonpath
            selector: "$['dbaas-services'][?@.name == '{$inputs.service}'].type"
      - stepId: delete
        operationId: delete-dbaas-service
        parameters:
          - name: name
            in: path
            value: $inputs.service
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.delete.outputs.job
        onSuccess:
          - name: deleted
            type: end
      # ClickHouse services have their own delete operation
      - stepId: delete-clickhouse
        operationId: delete-dbaas-service-clickhouse
        parameters:
          - name: name
            in: path
            value: $inputs.service
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done-clickhouse
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.delete-clickhouse.outputs.job
    outputs:
      deleted: $inputs.service

