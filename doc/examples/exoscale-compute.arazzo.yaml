  - workflowId: deploy-target-id
    summary: The id of a deploy target, given its name or id.
    x-ezu-args: [deploy-target]
    inputs:
      type: object
      required: [deploy-target]
      properties:
        deploy-target:
          type: string
          description: Deploy target name or id
    steps:
      - stepId: find
        operationId: list-deploy-targets
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['deploy-targets'][?@.name == '{$inputs.deploy-target}' || @.id == '{$inputs.deploy-target}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.deploy-target}' || @.id == '{$inputs.deploy-target}']) == 1]"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$['deploy-targets'][?@.name == '{$inputs.deploy-target}' || @.id == '{$inputs.deploy-target}'].id"
    outputs:
      id: $steps.find.outputs.id#/0

