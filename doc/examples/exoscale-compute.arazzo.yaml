          - name: skip-to-private-network
            type: goto
            stepId: private-network
            criteria:
              - condition: $inputs.anti-affinity-group == null
      - stepId: anti-affinity-group
        workflowId: $sourceDescriptions.common.anti-affinity-group-id
        parameters:
          - name: anti-affinity-group
            value: $inputs.anti-affinity-group
        onSuccess:
          - name: skip-to-create
            type: goto
            stepId: create
            criteria:
              - condition: $inputs.private-network == null
      - stepId: private-network
        workflowId: $sourceDescriptions.common.private-network-id
        parameters:
          - name: private-network
            value: $inputs.private-network
      - stepId: create
        operationId: create-instance-pool
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.name
            size: $inputs.size
            min-available: $inputs.min-available
            description: $inputs.description
            template:
              id: $steps.template.outputs.id#/0
            instance-type:
              id: $steps.instance-type.outputs.id#/0
            disk-size: $inputs.disk-size
