      - stepId: done
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.evict.outputs.job
      - stepId: show
        workflowId: nodepool-show
        parameters:
          - name: cluster
            value: $steps.find.outputs.cluster
          - name: nodepool
            value: $steps.find.outputs.id
    outputs:
      nodepool: $steps.show.outputs.nodepool

  - workflowId: nodepool-delete
    x-ezu-command: nodepool delete
    summary: Delete a nodepool and wait until it is gone.
    x-ezu-args: [cluster, nodepool]
    inputs:
      type: object
      required: [cluster, nodepool]
      properties:
        cluster:
          type: string
          description: Cluster name or id
        nodepool:
          type: string
          description: Nodepool name or id
    steps:
      - stepId: find
        workflowId: nodepool-id
        parameters:
          - name: cluster
            value: $inputs.cluster
          - name: nodepool
            value: $inputs.nodepool
      - stepId: delete
        operationId: delete-sks-nodepool
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.cluster
          - name: sks-nodepool-id
            in: path
            value: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.delete.outputs.job
