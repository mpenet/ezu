          description: Ids of the nodes' instances, as instances=ID, repeated
    steps:
      - stepId: find
        workflowId: nodepool-id
        parameters:
          - name: cluster
            value: $inputs.cluster
          - name: nodepool
            value: $inputs.nodepool
      - stepId: evict
        operationId: evict-sks-nodepool-members
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.cluster
          - name: sks-nodepool-id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
