  - workflowId: read-replica-list
    x-ezu-command: read-replica list
    summary: List the read replicas of a service, as integrations.
    x-ezu-args: [service]
    inputs:
      type: object
      required: [service]
      properties:
        service:
          type: string
          description: Database service name
    steps:
      - stepId: list
        operationId: list-dbaas-services
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['dbaas-services'][?@.name == '{$inputs.service}']"
        outputs:
          replicas:
            context: $response.body
            type: jsonpath
            selector: "$['dbaas-services'][?@.name == '{$inputs.service}'].integrations[?@.type == 'read_replica' && @.source == '{$inputs.service}']"
    outputs:
      replicas: $steps.list.outputs.replicas

