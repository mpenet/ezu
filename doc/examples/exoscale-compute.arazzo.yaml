  - workflowId: security-group-rule-add
    summary: Add a rule to a security group, from a network or another group.
    x-ezu-args: [security-group]
    inputs:
      type: object
      required: [security-group]
      properties:
        security-group:
          type: string
          description: Security group name or id
        flow:
          type: string
          enum: [ingress, egress]
          description: Direction of the traffic the rule allows
          default: ingress
        protocol:
          type: string
          enum: [tcp, udp, icmp, icmpv6, ah, esp, gre, ipip]
          description: Network protocol
          default: tcp
        port:
          type: integer
          description: Port, or first port of a range, for tcp and udp
        end-port:
          type: integer
          description: Last port of a range; port alone by default
        network:
          type: string
          description: Network the traffic comes from or goes to (CIDR)
        source-group:
          type: string
          description: Name of the security group the traffic comes from or goes to
        description:
          type: string
          description: Description
    steps:
      - stepId: find
        workflowId: security-group-id
        parameters:
          - name: security-group
            value: $inputs.security-group
        onSuccess:
          - name: range
            type: goto
            stepId: add-range
            criteria:
              - condition: $inputs.end-port != null
      - stepId: add
        operationId: add-rule-to-security-group
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            flow-direction: $inputs.flow
            protocol: $inputs.protocol
            start-port: $inputs.port
            end-port: $inputs.port
            network: $inputs.network
            security-group:
              name: $inputs.source-group
            description: $inputs.description
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.add.outputs.job
        onSuccess:
          - name: added
            type: goto
            stepId: show
      - stepId: add-range
        operationId: add-rule-to-security-group
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            flow-direction: $inputs.flow
            protocol: $inputs.protocol
            start-port: $inputs.port
            end-port: $inputs.end-port
            network: $inputs.network
            security-group:
              name: $inputs.source-group
            description: $inputs.description
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done-range
        workflowId: operation-wait
        parameters:
          - name: id
            value: $steps.add-range.outputs.job
      - stepId: show
        workflowId: security-group-show
        parameters:
          - name: security-group
            value: $steps.find.outputs.id
    outputs:
      security-group: $steps.show.outputs.security-group

