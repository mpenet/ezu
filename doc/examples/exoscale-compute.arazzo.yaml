  # Exoscale's defaults: the target port is the service's port, and the
  # health check's port the target port; each combination of given ports
  # is its own step.
  - workflowId: load-balancer-service-add
    x-ezu-command: load-balancer service add
    summary: Add a service to a network load balancer, forwarding to an instance pool.
    x-ezu-args: [load-balancer, name]
    inputs:
      type: object
      required: [load-balancer, name, instance-pool, port]
      properties:
        load-balancer:
          type: string
          description: Load balancer name or id
        name:
          type: string
          description: Service name
        description:
          type: string
          description: Description
        instance-pool:
          type: string
          description: Name or id of the instance pool to forward traffic to
        port:
          type: integer
          description: Port the load balancer listens on
        target-port:
          type: integer
          description: Port to forward traffic to on the instances; port by default
        protocol:
          type: string
          enum: [tcp, udp]
          description: Network protocol
          default: tcp
        strategy:
          type: string
          enum: [round-robin, maglev-hash, source-hash]
          description: Load balancing strategy
          default: round-robin
        healthcheck-mode:
          type: string
          enum: [tcp, http, https]
          description: Health check mode
          default: tcp
        healthcheck-port:
          type: integer
          description: Health check port; the target port by default
        healthcheck-uri:
          type: string
          description: Health check URI, required in http(s) mode
        healthcheck-interval:
          type: integer
          description: Seconds between checks
          default: 10
        healthcheck-timeout:
          type: integer
          description: Health check timeout, in seconds
          default: 5
        healthcheck-retries:
          type: integer
          description: Failed checks before an instance is taken out
          default: 1
        healthcheck-tls-sni:
          type: string
          description: Server name to present with SNI, in https mode
    steps:
      - stepId: find
        workflowId: load-balancer-id
        parameters:
          - name: load-balancer
            value: $inputs.load-balancer
      - stepId: instance-pool
        workflowId: instance-pool-id
        parameters:
          - name: instance-pool
            value: $inputs.instance-pool
        onSuccess:
          - name: both-ports
            type: goto
            stepId: add-both
            criteria:
              - condition: $inputs.target-port != null && $inputs.healthcheck-port != null
          - name: target-port
            type: goto
            stepId: add-target
            criteria:
              - condition: $inputs.target-port != null
          - name: healthcheck-port
            type: goto
            stepId: add-healthcheck
            criteria:
              - condition: $inputs.healthcheck-port != null
      - stepId: add
        operationId: add-service-to-load-balancer
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.name
            description: $inputs.description
            instance-pool:
              id: $steps.instance-pool.outputs.id
            protocol: $inputs.protocol
            strategy: $inputs.strategy
            port: $inputs.port
            target-port: $inputs.port
            healthcheck:
              mode: $inputs.healthcheck-mode
              port: $inputs.port
              uri: $inputs.healthcheck-uri
              interval: $inputs.healthcheck-interval
              timeout: $inputs.healthcheck-timeout
              retries: $inputs.healthcheck-retries
              tls-sni: $inputs.healthcheck-tls-sni
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: added
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.add.outputs.job
        onSuccess:
          - name: added
            type: goto
            stepId: show
      - stepId: add-target
        operationId: add-service-to-load-balancer
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.name
            description: $inputs.description
            instance-pool:
              id: $steps.instance-pool.outputs.id
            protocol: $inputs.protocol
            strategy: $inputs.strategy
            port: $inputs.port
            target-port: $inputs.target-port
            healthcheck:
              mode: $inputs.healthcheck-mode
              port: $inputs.target-port
              uri: $inputs.healthcheck-uri
              interval: $inputs.healthcheck-interval
              timeout: $inputs.healthcheck-timeout
              retries: $inputs.healthcheck-retries
              tls-sni: $inputs.healthcheck-tls-sni
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: added-target
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.add-target.outputs.job
        onSuccess:
          - name: added
            type: goto
            stepId: show
      - stepId: add-healthcheck
        operationId: add-service-to-load-balancer
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.name
            description: $inputs.description
            instance-pool:
              id: $steps.instance-pool.outputs.id
            protocol: $inputs.protocol
            strategy: $inputs.strategy
            port: $inputs.port
            target-port: $inputs.port
            healthcheck:
              mode: $inputs.healthcheck-mode
              port: $inputs.healthcheck-port
              uri: $inputs.healthcheck-uri
              interval: $inputs.healthcheck-interval
              timeout: $inputs.healthcheck-timeout
              retries: $inputs.healthcheck-retries
              tls-sni: $inputs.healthcheck-tls-sni
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: added-healthcheck
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.add-healthcheck.outputs.job
        onSuccess:
          - name: added
            type: goto
            stepId: show
      - stepId: add-both
        operationId: add-service-to-load-balancer
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.name
            description: $inputs.description
            instance-pool:
              id: $steps.instance-pool.outputs.id
            protocol: $inputs.protocol
            strategy: $inputs.strategy
            port: $inputs.port
            target-port: $inputs.target-port
            healthcheck:
              mode: $inputs.healthcheck-mode
              port: $inputs.healthcheck-port
              uri: $inputs.healthcheck-uri
              interval: $inputs.healthcheck-interval
              timeout: $inputs.healthcheck-timeout
              retries: $inputs.healthcheck-retries
              tls-sni: $inputs.healthcheck-tls-sni
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: added-both
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.add-both.outputs.job
      - stepId: show
        workflowId: load-balancer-service-show
        parameters:
          - name: load-balancer
            value: $steps.find.outputs.id
          - name: service
            value: $inputs.name
    outputs:
      service: $steps.show.outputs.service

