  - workflowId: template-show
    x-ezu-command: template show
    summary: Show a template.
    x-ezu-args: [template]
    inputs:
      type: object
      required: [template]
      properties:
        template:
          type: string
          description: Template name or id
        visibility:
          type: string
          enum: [public, private]
          description: Where to look for the template
          default: public
    steps:
      - stepId: find
        operationId: list-templates
        parameters:
          - name: visibility
            in: query
            value: $inputs.visibility
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']) == 1]"
        outputs:
          template:
            context: $response.body
            type: jsonpath
            selector: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']"
    outputs:
      template: $steps.find.outputs.template#/0

