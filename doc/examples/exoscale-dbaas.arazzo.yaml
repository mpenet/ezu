    x-ezu-command: read-replica promote
    summary: Promote a read replica to a standalone service.
    x-ezu-args: [replica]
    inputs:
      type: object
      required: [replica]
      properties:
        replica:
          type: string
          description: Read replica name
    steps:
      - stepId: find
        operationId: list-dbaas-services
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['dbaas-services'][?@.name == '{$inputs.replica}'].integrations[?@.type == 'read_replica' && @.dest == '{$inputs.replica}']"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$['dbaas-services'][?@.name == '{$inputs.replica}'].integrations[?@.type == 'read_replica' && @.dest == '{$inputs.replica}'].id"
      - stepId: promote
