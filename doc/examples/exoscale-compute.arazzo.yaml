      - stepId: done
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.update.outputs.job
        onSuccess:
          - name: same-size
            type: goto
            stepId: show
            criteria:
              - condition: $inputs.size == null
      - stepId: resize
        operationId: resize-block-storage-volume
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
