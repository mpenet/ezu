    x-ezu-args: [load-balancer, service]
    inputs:
      type: object
      required: [load-balancer, service]
      properties:
        load-balancer:
          type: string
          description: Load balancer id
        service:
          type: string
          description: Service name or id
    steps:
      - stepId: find
        operationId: get-load-balancer
        parameters:
          - name: id
            in: path
            value: $inputs.load-balancer
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$.services[?@.name == '{$inputs.service}' || @.id == '{$inputs.service}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.service}' || @.id == '{$inputs.service}']) == 1]"
        outputs:
