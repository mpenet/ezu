  - workflowId: load-balancer-id
    summary: The id of a network load balancer, given its name or id.
    x-ezu-args: [load-balancer]
    inputs:
      type: object
      required: [load-balancer]
      properties:
        load-balancer:
          type: string
          description: Load balancer name or id
    steps:
      - stepId: find
        operationId: list-load-balancers
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$['load-balancers'][?@.name == '{$inputs.load-balancer}' || @.id == '{$inputs.load-balancer}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.load-balancer}' || @.id == '{$inputs.load-balancer}']) == 1]"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$['load-balancers'][?@.name == '{$inputs.load-balancer}' || @.id == '{$inputs.load-balancer}'].id"
    outputs:
      id: $steps.find.outputs.id#/0

  - workflowId: load-balancer-service-id
