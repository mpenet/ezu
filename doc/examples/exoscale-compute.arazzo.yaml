          - name: visibility
            value: private
    outputs:
      template: $steps.show.outputs.template

  - workflowId: template-copy
    x-ezu-command: template copy
    summary: Copy one of your templates to another zone, and give the copy's id.
    x-ezu-args: [template, zone]
    inputs:
      type: object
      required: [template, zone]
      properties:
        template:
          type: string
          description: Template name or id
        zone:
          type: string
          enum: [ch-dk-2, de-muc-1, ch-gva-2, at-vie-1, de-fra-1, bg-sof-1, at-vie-2, hr-zag-1]
          description: Zone to copy the template to
    steps:
      - stepId: find
        workflowId: private-template-id
        parameters:
          - name: template
            value: $inputs.template
      - stepId: copy
        operationId: copy-template
        parameters:
          - name: id
            in: path
            value: $steps.find.outputs.id
        requestBody:
          contentType: application/json
          payload:
            target-zone:
              name: $inputs.zone
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          job: $response.body#/id
      - stepId: done
        workflowId: $sourceDescriptions.common.operation-wait
        parameters:
          - name: id
            value: $steps.copy.outputs.job
    outputs:
      copy: $steps.done.outputs.reference

  - workflowId: private-template-id
    summary: The id of one of your templates, given its name or id.
    x-ezu-args: [template]
    inputs:
      type: object
      required: [template]
      properties:
        template:
          type: string
          description: Template name or id
    steps:
      - stepId: find
        operationId: list-templates
        parameters:
          - name: visibility
            in: query
            value: private
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']"
          # one only: a name that several share is ambiguous
          - context: $response.body
            type: jsonpath
            condition: "$[?count(@[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}']) == 1]"
        outputs:
          id:
            context: $response.body
            type: jsonpath
            selector: "$.templates[?@.name == '{$inputs.template}' || @.id == '{$inputs.template}'].id"
    outputs:
      id: $steps.find.outputs.id#/0

